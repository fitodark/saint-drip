# Local services for development and for every Verify command (blueprint §19.6).
# Image tags are version pins — provenance in blueprint §11.
services:
  postgres:
    image: postgres:17.12-alpine
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: saint_drip
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d saint_drip"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4.12-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
